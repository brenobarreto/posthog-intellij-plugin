group = io.github.brenobarreto.posthog
version = 0.0.1

pluginRepositoryUrl = https://github.com/brenobarreto/posthog-intellij-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Incremental Kotlin compilation can leave test classes compiled against an old constructor after a change like
# adding default parameters, and Gradle's build cache then stores and replays those stale classes. The project
# is small enough that full compiles cost seconds.
kotlin.incremental = false
